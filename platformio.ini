; PlatformIO Project Configuration File
;
; Target: Elecrow CrowPanel Advance 3.5" HMI (ESP32-S3-WROOM-1-N16R8)
;   16 MB QIO flash, 8 MB octal PSRAM, ILI9488 480x320 IPS, GT911 touch.
;
; Pin assignments come from Elecrow's own reference material - see
; include/board_config.hpp for the sources.

[env:crowpanel_advance_35]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLGFX_USE_V1
    -I include

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    lvgl/lvgl@^8.3.11

; USB CDC console. The ECU link runs on UART1 at 19200 (see board_config.hpp).
monitor_speed = 115200
upload_speed = 921600
