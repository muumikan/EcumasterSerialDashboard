; PlatformIO Project Configuration File
;
; Target: Elecrow CrowPanel Advance 3.5" HMI (ESP32-S3-WROOM-1-N16R8)
;   16 MB QIO flash, 8 MB octal PSRAM, ILI9488 480x320 IPS, GT911 touch.
;
; Pin assignments come from Elecrow's own reference material - see
; include/board_config.hpp for the sources.

[platformio]
; The car's ECU is configured for EDL-1, so that is what a bare `pio run`
; builds. The classic environment stays for an ECU still on the old protocol -
; building it against an EDL-1 ECU gives a dashboard that shows nothing.
default_envs = crowpanel_advance_35_edl

[env:crowpanel_advance_35]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLGFX_USE_V1
    -I include

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    lvgl/lvgl@^8.3.11

; USB CDC console. The ECU link runs on UART1 at 19200 (see board_config.hpp).
monitor_speed = 115200
upload_speed = 921600

; Same firmware against the EMU's EDL-1 logger stream instead of the classic
; serial protocol: 195 channels in 260-byte frames at 115200 rather than 34
; channels one at a time at 19200. The ECU has to be configured to match.
[env:crowpanel_advance_35_edl]
extends = env:crowpanel_advance_35
build_flags = ${env:crowpanel_advance_35.build_flags} -DECU_LINK_EDL
